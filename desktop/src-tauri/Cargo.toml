[package]
name = "holysheet-desktop"
version = "2.0.0"
description = "HolySheet desktop: game tables from xlsx, CSV and Google Sheets"
authors = ["shlifedev"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows linker issue: rust-lang/cargo#8519).
name = "holysheet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
